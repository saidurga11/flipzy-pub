version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: flipzy-postgres
    environment:
      POSTGRES_USER: flipzy
      POSTGRES_PASSWORD: flipzy123
      POSTGRES_DB: flipzy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flipzy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flipzy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flipzy-server
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://flipzy:flipzy123@postgres:5432/flipzy
      REDIS_URL: redis://redis:6379
      JWT_SECRET: flipzy-dev-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
